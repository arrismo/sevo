services:
  hermes:
    image: nousresearch/hermes-agent:v2026.8.27
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --app-dir
      - /sevo/hermes_service
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      HERMES_HOME: /opt/data
      PYTHONPATH: /sevo/backend:/opt/hermes
      SEVO_DATA_DIR: /sevo/data
      SEVO_DATABASE_PATH: /sevo/storage/sevo.db
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_CONTEXT_LENGTH: ${LM_STUDIO_CONTEXT_LENGTH:-16384}
      HERMES_MAX_ITERATIONS: ${HERMES_MAX_ITERATIONS:-2}
      HERMES_FAST_PATH: ${HERMES_FAST_PATH:-false}
      SEVO_RECENT_WINDOW_HOURS: ${SEVO_RECENT_WINDOW_HOURS:-48}
    volumes:
      - ./hermes_service:/sevo/hermes_service:ro
      - ./backend/app:/sevo/backend/app:ro
      - ./data:/sevo/data:ro
      - sevo_storage:/sevo/storage:ro
    tmpfs:
      - /opt/data:size=64m,mode=0700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8001"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SEVO_DATA_DIR: /app/data
      SEVO_DATABASE_PATH: /app/storage/sevo.db
      SEVO_AGENT_ENABLED: ${SEVO_AGENT_ENABLED:-true}
      HERMES_BASE_URL: http://hermes:8001
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-240}
      SEVO_RECENT_WINDOW_HOURS: ${SEVO_RECENT_WINDOW_HOURS:-48}
    volumes:
      - ./data:/app/data:ro
      - sevo_storage:/app/storage
    depends_on:
      - hermes
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${SEVO_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sevo_storage:
